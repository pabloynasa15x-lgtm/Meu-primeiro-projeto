<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>💖 Para Você 💖</title>

<style>
body {
  margin: 0;
  font-family: 'Arial';
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  overflow-x: hidden;
  text-align: center;
}

h1, h2 {
  color: white;
}

.section {
  padding: 40px 20px;
  display: none;
  animation: fade 1s;
}

.active {
  display: block;
}

@keyframes fade {
  from {opacity: 0;}
  to {opacity: 1;}
}

/* BOTÃO */
button {
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  background: #ff4d88;
  color: white;
  font-size: 16px;
  cursor: pointer;
  margin-top: 20px;
}

/* CAÇA PALAVRAS */
table {
  margin: auto;
  border-collapse: collapse;
}
td {
  width: 35px;
  height: 35px;
  border: 1px solid white;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.selected {
  background: #ff4d88;
}

/* MEMÓRIA */
.card {
  display: inline-block;
  width: 70px;
  height: 70px;
  margin: 10px;
  background: white;
  border-radius: 15px;
  line-height: 70px;
  font-size: 25px;
  cursor: pointer;
}

/* IMAGENS */
.timeline img {
  width: 160px;
  border-radius: 15px;
  margin: 10px;
  transition: 0.4s;
  cursor: pointer;
}
.timeline img:hover {
  transform: scale(1.1);
}

/* CORAÇÕES */
.heart {
  position: fixed;
  bottom: -20px;
  font-size: 20px;
  animation: subir 5s linear infinite;
}
@keyframes subir {
  to {
    transform: translateY(-100vh);
    opacity: 0;
  }
}
</style>

</head>
<body>

<audio autoplay loop>
  <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
</audio>

<h1>💖 Tenho algo pra você 💖</h1>
<button onclick="next(1)">Começar</button>

<!-- CAÇA PALAVRAS -->
<div class="section" id="s1">
<h2>🎮 Encontre nosso amor</h2>
<table id="grid"></table>
<p id="msg1"></p>
</div>

<!-- MEMÓRIA -->
<div class="section" id="s2">
<h2>🧠 Jogo da Memória</h2>
<div id="memory"></div>
<p id="msg2"></p>
</div>

<!-- PUZZLE -->
<div class="section" id="s3">
<h2>🧩 Clique na nossa foto</h2>
<img src="https://via.placeholder.com/300" width="300" onclick="next(4)">
</div>

<!-- LINHA DO TEMPO -->
<div class="section timeline" id="s4">
<h2>💞 Nossa História</h2>

<img src="https://via.placeholder.com/150" onclick="showMsg('Foi aqui que tudo começou 💖')">
<img src="https://via.placeholder.com/150" onclick="showMsg('Cada momento contigo é especial 😍')">
<img src="https://via.placeholder.com/150" onclick="showMsg('Eu escolheria você mil vezes ❤️')">

<h2 id="finalMsg"></h2>
</div>

<script>

/* TRANSIÇÃO */
function next(id){
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById("s"+id).classList.add("active");
}

/* CORAÇÕES */
setInterval(()=>{
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random()*100+"vw";
  heart.style.fontSize = (Math.random()*20+10)+"px";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),5000);
},500);

/* CAÇA PALAVRAS */
const grid = [
["A","M","O","R","X","Z","B","E","I","J","O"],
["L","I","N","D","A","Q","W","E","R","T","Y"],
["C","A","R","I","N","H","O","U","I","O","P"],
["S","A","U","D","A","D","E","A","S","D","F"],
["N","O","S","S","A","G","H","J","K","L","Z"],
["E","T","E","R","N","O","X","C","V","B","N"],
["A","B","R","A","C","O","M","N","B","V","C"],
["D","O","C","E","Z","X","C","V","B","N","M"],
["Q","W","E","R","T","Y","U","I","O","P","A"],
["Z","X","C","O","N","E","X","A","O","L","K"],
["M","N","B","V","C","X","Z","A","S","D","F"],
["P","O","I","U","Y","T","R","E","W","Q","A"]
];

const table = document.getElementById("grid");

grid.forEach(row=>{
  let tr = document.createElement("tr");
  row.forEach(cell=>{
    let td = document.createElement("td");
    td.innerText = cell;
    td.onclick = ()=>{
      td.classList.toggle("selected");
      check();
    }
    tr.appendChild(td);
  });
  table.appendChild(tr);
});

function check(){
  let selected = document.querySelectorAll(".selected").length;
  if(selected > 30){
    document.getElementById("msg1").innerHTML = "💖 Você encontrou nosso amor!";
    setTimeout(()=>next(2),1500);
  }
}

/* MEMÓRIA */
const cards = ["💖","💖","😍","😍","🥰","🥰"];
let opened = [];

cards.sort(()=>0.5 - Math.random());

cards.forEach(card=>{
  let div = document.createElement("div");
  div.className = "card";
  div.innerText = "?";

  div.onclick = ()=>{
    div.innerText = card;
    opened.push({div,card});

    if(opened.length==2){
      if(opened[0].card!=opened[1].card){
        setTimeout(()=>{
          opened[0].div.innerText="?"
          opened[1].div.innerText="?"
          opened=[]
        },700);
      } else {
        opened=[];
        checkMem();
      }
    }
  }

  document.getElementById("memory").appendChild(div);
});

function checkMem(){
  let done=[...document.querySelectorAll(".card")].every(c=>c.innerText!="?");
  if(done){
    document.getElementById("msg2").innerHTML="🥰 Perfeito!";
    setTimeout(()=>next(3),1500);
  }
}

/* MENSAGENS NAS FOTOS */
function showMsg(text){
  document.getElementById("finalMsg").innerHTML = text + "<br><br>💌 Nosso amor eterno é lindo, cheio de carinho, abraços e beijos doces.";
}

</script>

</body>
</html>
